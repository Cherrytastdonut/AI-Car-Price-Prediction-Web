name: Train car price model

on:
  push:
    paths:
      - "archive.zip"
      - "modeling/**"
      - "requirements.txt"
      - ".github/workflows/train-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train and evaluate models
        run: python modeling/train_model.py

      - name: Commit trained model and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/model.json model/metrics.json api/model.js
          if git diff --cached --quiet; then
            echo "No model changes"
          else
            git commit -m "Train car price ML model [skip ci]"
            git push
          fi

      - name: Upload model report
        uses: actions/upload-artifact@v4
        with:
          name: car-price-model
          path: |
            model/model.json
            model/metrics.json
